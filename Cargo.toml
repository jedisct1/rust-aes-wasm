[package]
name = "aes-wasm"
version = "0.2.0"
edition = "2021"
readme = "README.md"
license = "MIT"
repository = "https://github.com/jedisct1/rust-aes-wasm"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "AES and AEGIS encryption for WebAssembly/WASI: AEAD, AES-GCM, AES-OCB, AES-CTR, AES-CBC, and CMAC"
keywords = ["aes-gcm", "aead", "encryption", "wasm", "wasi"]

[dev-dependencies]
benchmark-simple = "0.1.11"
aegis = "0.9.19"
aes-gcm = "0.10.3"
cmac = "0.7.2"
ctr = "0.9.2"
cbc = "0.1.2"

[[bench]]
name = "benchmark"
harness = false
